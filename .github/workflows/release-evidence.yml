name: Release evidence

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: pip install -e .
      - run: python -m ruff check .
      - run: python -m pytest -q
      - run: python scripts/validate_detections.py
      - run: python scripts/validate_public_data.py data/demo_events.jsonl
      - run: python scripts/generate_sbom.py
      - run: python scripts/build_release_evidence.py
      - uses: actions/upload-artifact@v7
        with:
          name: ot-sentinel-${{ github.ref_name }}-evidence
          path: artifacts/
          if-no-files-found: error
          retention-days: 90

