name: CI

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: pip install -e .
      - run: python -m pip check
      - run: python -m ruff check .
      - run: python -m pytest -q
      - run: python -m json.tool docs/api/collector.openapi.json > /dev/null
      - run: python -m openapi_spec_validator docs/api/collector.openapi.json
      - run: python scripts/validate_detections.py
      - run: python scripts/generate_demo_data.py
      - run: python scripts/validate_public_data.py data/demo_events.jsonl
      - run: python scripts/build_public_summary.py data/demo_events.jsonl data/demo_summary.json
      - run: python -m pip_audit -r requirements-dev.txt
      - name: Verify generated data is reproducible
        run: git diff --exit-code -- data/demo_events.jsonl data/demo_summary.json
