name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - run: python -m unittest discover -s tests -v
      - run: python scripts/generate_demo_data.py
      - run: python scripts/validate_public_data.py data/demo_events.jsonl
      - name: Verify generated data is reproducible
        run: git diff --exit-code -- data/demo_events.jsonl

