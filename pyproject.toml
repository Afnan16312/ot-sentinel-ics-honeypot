[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ot-sentinel"
version = "0.1.0"
description = "Low-interaction OT/ICS honeypot telemetry and ATT&CK visualization"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Afnan"}]
dependencies = []

[project.optional-dependencies]
dashboard = [
  "pandas>=2.2,<4",
  "plotly>=6.0,<7",
  "streamlit>=1.48,<2",
]
geoip = ["geoip2>=5,<6"]
dev = ["pytest>=8,<9", "ruff>=0.12,<1"]

[project.scripts]
ot-sentinel = "ot_sentinel.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
