[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ot-sentinel"
version = "0.2.0"
description = "Low-interaction OT/ICS honeypot telemetry and ATT&CK visualization"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Mir Afnan Ali"}]
dependencies = []

[project.optional-dependencies]
dashboard = [
  "pandas>=2.2,<4",
  "plotly>=6.0,<7",
  "streamlit>=1.48,<2",
]
geoip = ["geoip2>=5,<6"]
dev = [
  "pip-audit>=2.9,<3",
  "pytest>=9.0.3,<10",
  "ruff>=0.12,<1",
  "stix2-validator==3.2.0",
]

[project.scripts]
ot-sentinel = "ot_sentinel.cli:main"
ot-sentinel-collector = "ot_sentinel.collector:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
